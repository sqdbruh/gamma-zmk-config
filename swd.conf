# Overlay for SWD-direct flashing (no UF2 bootloader on the chip).
#
# Default builds put the application at the `code_partition` offset
# (0x26000 on nrf52840) because they expect the Adafruit UF2 bootloader
# at 0x0. After `nrfjprog --recover` that bootloader is gone, so the
# vectors must land at 0x0 or the chip won't boot.
#
# Apply with: -DEXTRA_CONF_FILE=swd.conf

CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_BUILD_OUTPUT_UF2=n
