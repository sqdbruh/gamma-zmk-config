# Overlay applied on top of a normal board build to produce a one-shot
# "settings reset" firmware. Flash this UF2 to wipe BLE bonds and any
# stored ZMK settings, then re-flash the regular firmware.
#
# Apply with: -DEXTRA_CONF_FILE=settings_reset.conf

CONFIG_ZMK_SETTINGS_RESET_ON_START=y
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
