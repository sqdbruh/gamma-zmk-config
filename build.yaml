# See https://zmk.dev/docs/user-setup/manual#build-yaml-syntax
include:
  - board: gamma_left
  - board: gamma_right
  - board: gamma_dongle
    snippet: studio-rpc-usb-uart
  # Settings-reset variants: flash once to wipe BLE bonds and ZMK
  # settings storage, then re-flash the regular firmware. Used to
  # re-pair halves with the dongle from a clean state.
  - board: gamma_left
    cmake-args: -DEXTRA_CONF_FILE=settings_reset.conf
    artifact-name: gamma_left_reset
  - board: gamma_right
    cmake-args: -DEXTRA_CONF_FILE=settings_reset.conf
    artifact-name: gamma_right_reset
  - board: gamma_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DEXTRA_CONF_FILE=settings_reset.conf
    artifact-name: gamma_dongle_reset
